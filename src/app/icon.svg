<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Summit Quest">
  <!--
    The Summit Quest mark (design/DESIGN-SYSTEM.md §7.14): a Meadow tile, a
    white double peak, a Sunset cap on the summit. Filled shapes only, so it
    still reads at 16 px in a browser tab. The same drawing is `LogoMark` in
    src/components/ui/logo.tsx; the PNGs in public/ are built from it by
    scripts/build-icons.mjs.
  -->
  <rect width="64" height="64" rx="16" fill="#157a47"/>
  <path d="M9 49 26.5 17.5 37 36.5 43 27.5 55 49Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  <path d="M26.5 17.5 33.4 30 29.6 27.2 26.6 31.4 23.6 27.6 19.9 29.4Z" fill="#ff6a3d" stroke="#ff6a3d" stroke-width="2" stroke-linejoin="round"/>
</svg>
